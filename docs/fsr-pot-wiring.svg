<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f7f9fb"/>
  <style>
    .title { font: 700 30px Helvetica, Arial, sans-serif; fill: #172332; }
    .subtitle { font: 18px Helvetica, Arial, sans-serif; fill: #526273; }
    .label { font: 700 21px Helvetica, Arial, sans-serif; fill: #172332; }
    .small { font: 17px Helvetica, Arial, sans-serif; fill: #526273; }
    .pin { font: 700 19px Helvetica, Arial, sans-serif; fill: #fff; }
    .wire { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .red { stroke: #db4f55; }
    .blue { stroke: #3c6f9e; }
    .orange { stroke: #e58a3d; }
    .purple { stroke: #7657a8; }
    .green { stroke: #438e72; }
  </style>

  <text x="60" y="58" class="title">FSR + 10K resistor + potentiometer</text>
  <text x="60" y="91" class="subtitle">The FSR and resistor share one A0 node.</text>

  <!-- Arduino board -->
  <rect x="65" y="150" width="285" height="485" rx="18" fill="#1e2935"/>
  <text x="105" y="205" class="pin">ARDUINO UNO</text>
  <text x="112" y="237" class="small" fill="#c5d0da">analog pins</text>

  <rect x="245" y="280" width="105" height="48" rx="7" fill="#db4f55"/>
  <text x="270" y="312" class="pin">5V</text>
  <rect x="245" y="355" width="105" height="48" rx="7" fill="#7657a8"/>
  <text x="270" y="387" class="pin">A0</text>
  <rect x="245" y="430" width="105" height="48" rx="7" fill="#438e72"/>
  <text x="270" y="462" class="pin">A1</text>
  <rect x="245" y="505" width="105" height="48" rx="7" fill="#3c6f9e"/>
  <text x="262" y="537" class="pin">GND</text>

  <!-- Breadboard / FSR divider -->
  <rect x="475" y="145" width="300" height="505" rx="18" fill="#e5ebf0" stroke="#b6c4cf" stroke-width="3"/>
  <text x="530" y="195" class="label">FSR 分压电路</text>
  <text x="525" y="227" class="small">FSR 两只脚没有正负</text>

  <!-- FSR -->
  <rect x="555" y="270" width="145" height="75" rx="37" fill="#fff" stroke="#e58a3d" stroke-width="6"/>
  <text x="604" y="315" class="label" fill="#b96822">FSR</text>
  <text x="532" y="380" class="small">压力传感器</text>

  <!-- divider node -->
  <circle cx="700" cy="385" r="10" fill="#7657a8"/>
  <text x="715" y="376" class="label" fill="#7657a8">A0 节点</text>
  <text x="715" y="402" class="small">三根线接在这里</text>

  <!-- resistor -->
  <path d="M700 385 L700 425 L670 442 L730 467 L670 492 L730 517 L700 534" fill="none" stroke="#7657a8" stroke-width="6"/>
  <text x="555" y="465" class="label">10KΩ 电阻</text>
  <text x="555" y="495" class="small">另一端接 GND</text>

  <!-- wires from Arduino to FSR divider -->
  <path d="M350 304 H430 V307 H555" class="wire red"/>
  <path d="M350 379 H430 V385 H700" class="wire purple"/>
  <path d="M700 534 V575 H430 V529 H350" class="wire blue"/>
  <circle cx="700" cy="385" r="14" fill="#f7f9fb" stroke="#7657a8" stroke-width="5"/>
  <circle cx="700" cy="385" r="6" fill="#7657a8"/>

  <!-- Potentiometer -->
  <rect x="865" y="145" width="270" height="505" rx="18" fill="#e5ebf0" stroke="#b6c4cf" stroke-width="3"/>
  <text x="914" y="195" class="label">电位器</text>
  <text x="900" y="227" class="small">中间脚是 wiper</text>
  <circle cx="1000" cy="350" r="63" fill="#fff" stroke="#687a8a" stroke-width="5"/>
  <line x1="1000" y1="350" x2="1045" y2="320" stroke="#687a8a" stroke-width="8" stroke-linecap="round"/>
  <text x="932" y="455" class="small">左外侧脚 → 5V</text>
  <text x="932" y="490" class="small">中间脚 → A1</text>
  <text x="932" y="525" class="small">右外侧脚 → GND</text>

  <!-- pot wires -->
  <path d="M350 304 H410 V600 H900 V560" class="wire red"/>
  <path d="M350 454 H430 V570 H865 V490" class="wire green"/>
  <path d="M350 529 H410 V625 H900 V595" class="wire blue"/>
  <circle cx="900" cy="560" r="8" fill="#db4f55"/>
  <circle cx="865" cy="490" r="8" fill="#438e72"/>
  <circle cx="900" cy="595" r="8" fill="#3c6f9e"/>

  <!-- bottom reminder -->
  <rect x="65" y="680" width="1070" height="48" rx="10" fill="#172332"/>
  <text x="95" y="712" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">FSR 按下时，A0 数值升高；旋转电位器时，A1 数值变化。</text>
</svg>
